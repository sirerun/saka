apiVersion: v1
kind: ConfigMap
metadata:
  name: saka-config
  namespace: saka
  labels:
    app.kubernetes.io/name: saka
    app.kubernetes.io/part-of: saka
data:
  saka.json: |
    {
      "providers": [
        { "name": "searxng", "url": "http://searxng:8080", "rps": 5, "retries": 2 },
        { "name": "duckduckgo", "rps": 1, "retries": 2 }
      ],
      "fetch": {
        "rps": 2,
        "cache_ttl_seconds": 3600,
        "respect_robots": true,
        "disk_cache": { "dir": "/home/saka/.cache/saka", "ttl_seconds": 86400 }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saka
  namespace: saka
  labels:
    app.kubernetes.io/name: saka
    app.kubernetes.io/part-of: saka
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saka
        app.kubernetes.io/part-of: saka
    spec:
      containers:
        - name: saka
          image: saka:local
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --addr
            - :8080
            - --config
            - /etc/saka/saka.json
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/saka
              readOnly: true
            - name: cache
              mountPath: /home/saka/.cache/saka
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: saka-config
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: saka
  namespace: saka
  labels:
    app.kubernetes.io/name: saka
    app.kubernetes.io/part-of: saka
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: saka
  ports:
    - name: http
      port: 8080
      targetPort: http
