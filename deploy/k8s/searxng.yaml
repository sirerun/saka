apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: saka
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: saka
data:
  settings.yml: |
    use_default_settings: true
    server:
      # Rotate in production (openssl rand -hex 32).
      secret_key: "saka-dev-searxng-secret-change-me"
      limiter: false
      bind_address: "0.0.0.0"
      port: 8080
    search:
      formats:
        - html
        - json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: saka
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: saka
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
        app.kubernetes.io/part-of: saka
    spec:
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: searxng-config
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: saka
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: saka
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
