name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Vet
        run: go vet ./...
      - name: Test (race + cover)
        run: |
          pkgs=$(go list ./... | grep -v '/cli/')
          go test $pkgs -race -coverprofile=coverage.out
      - name: Coverage gate
        # Honest v1 floor: network-heavy packages keep total below 70%.
        # Raise as more unit tests land. CLI main is excluded from the profile.
        run: |
          cov=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: $cov%"
          [ "$(echo "$cov >= 40" | bc)" = 1 ] || { echo "coverage below 40%"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.out }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: golangci/golangci-lint-action@v6
        with: { version: latest }

  build-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t saka:ci .
      - name: Smoke the compose stack
        run: |
          cp deploy/searxng/settings.yml /tmp/ 2>/dev/null || true
          docker compose up -d
          sleep 20
          ./deploy/smoke.sh
          docker compose down
