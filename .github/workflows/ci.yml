name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.27" }
      - name: Vet
        run: go vet ./...
      - name: Test (race + cover)
        run: |
          pkgs=$(go list ./... | grep -v '/cli/')
          go test $pkgs -race -coverprofile=coverage.out
      - name: Coverage gate
        # Honest v1 floor: network-heavy packages keep total below 70%.
        # Raise as more unit tests land. CLI main is excluded from the profile.
        run: |
          cov=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: $cov%"
          [ "$(echo "$cov >= 40" | bc)" = 1 ] || { echo "coverage below 40%"; exit 1; }
      - uses: actions/upload-artifact@v7
        with: { name: coverage, path: coverage.out }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.27" }
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.11.3 }

  # Runs on GitHub-hosted runners (Docker + kind available there).
  # Do not require Docker/kind on developer laptops.
  k8s-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: saka
      - name: Build image and load into kind
        run: |
          docker build -t saka:ci .
          kind load docker-image saka:ci --name saka
      - name: Apply manifests and smoke
        run: |
          chmod +x deploy/k8s/apply.sh deploy/smoke.sh
          SAKA_IMAGE=saka:ci ./deploy/k8s/apply.sh
          kubectl -n saka wait --for=condition=available deploy/saka --timeout=180s
          kubectl -n saka port-forward svc/saka 8080:8080 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health >/dev/null && break
            sleep 1
          done
          SAKA_BASE_URL=http://127.0.0.1:8080 ./deploy/smoke.sh
